<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17352d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chess"><link rel="icon" href="icon.png" type="image/png"><link rel="apple-touch-icon" href="icon.png"><title>Chess — Play & Learn</title>
<style>
:root{--bg:#f4f1e8;--ink:#17251f;--green:#21483b;--cream:#f0d9b5;--tan:#b58863;--gold:#f5ce61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}header{background:var(--green);color:white;padding:20px 18px 17px;text-align:center}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#d9e6df;font-size:13px}main{max-width:560px;margin:0 auto;padding:16px 13px 30px}.panel{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #18352b12}.status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:700}.pill{font-size:11px;font-weight:700;background:#e8efe9;color:#28513f;border-radius:99px;padding:7px 9px;white-space:nowrap}.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;overflow:hidden;border-radius:8px;border:2px solid #294537;touch-action:manipulation}.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;border:0;padding:0;min-width:0;cursor:pointer;font-family:"Segoe UI Symbol","DejaVu Sans",serif;font-size:clamp(27px,8vw,49px);line-height:1}.light{background:var(--cream)}.dark{background:var(--tan)}.piece.white{color:#fffdf4;text-shadow:1px 1px 1px #242424,-1px -1px 1px #242424,1px -1px 1px #242424,-1px 1px 1px #242424}.piece.black{color:#171717;text-shadow:0 1px #fff4}.square.selected{box-shadow:inset 0 0 0 4px var(--gold)}.square.last{background-image:linear-gradient(#f7df6a66,#f7df6a66)}.square:focus-visible{outline:3px solid #1467c5;outline-offset:-3px}.coord{position:absolute;font:10px/1 sans-serif;opacity:.75;pointer-events:none}.rank{top:3px;left:4px}.file{bottom:3px;right:4px}.light .coord{color:#76563d}.dark .coord{color:#f8e8d4}.dot{position:absolute;width:25%;height:25%;border-radius:50%;background:#285d3c8c;pointer-events:none}.capture-ring{position:absolute;inset:5%;border:4px solid #285d3c8c;border-radius:50%;pointer-events:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button.action{border:0;border-radius:11px;padding:12px 8px;font-size:14px;font-weight:700;background:#e9eee9;color:#244638;cursor:pointer}button.primary{background:var(--green);color:white}button:disabled{opacity:.38;cursor:default}.note{margin:12px 2px 0;min-height:20px;font-size:13px;line-height:1.5;color:#53645b}.moves{margin-top:14px;border-top:1px solid #e6e9e4;padding-top:12px}.moves h2{font-size:14px;margin:0 0 8px}.move-list{font-size:13px;line-height:1.8;max-height:100px;overflow:auto;color:#47574e}.footer{text-align:center;font-size:11px;color:#738078;margin-top:15px}@media(min-width:500px){main{padding-top:22px}.panel{padding:18px}.square{font-size:48px}}
</style></head>
<body><header><h1>♟ Chess</h1><p>A simple chess game for your phone</p></header><main><section class="panel"><div class="status"><span id="status" aria-live="polite">Loading chess…</span><span class="pill" id="turn">WHITE TO MOVE</span></div><div class="board" id="board" role="group" aria-label="Chessboard"></div><div class="actions"><button class="action" id="back">← Back</button><button class="action primary" id="restart">↻ Restart</button><button class="action" id="flip">⇅ Flip board</button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px"><label for="level">Computer strength (Stockfish)</label><select id="level" style="padding:8px;border:1px solid #cbd5ce;border-radius:9px;background:white;color:#244638"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select></div><div class="note" id="note">You play White. Stockfish plays Black. The first engine download needs internet.</div><div class="moves"><h2>Move history</h2><div class="move-list" id="moves">Your moves will appear here.</div></div></section><div class="footer">Play against Stockfish · Works on mobile and desktop</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
(function(){const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟︎'};const boardEl=document.getElementById('board'),statusEl=document.getElementById('status'),turnEl=document.getElementById('turn'),noteEl=document.getElementById('note'),movesEl=document.getElementById('moves');let game,selected=null,flipped=false,lastMove=null,busy=false,gameToken=0;try{if(!window.Chess)throw Error('Chess rules could not load. Check your internet connection, then reload.');game=new Chess()}catch(e){statusEl.textContent='Unable to start';noteEl.textContent=e.message;return}function sqName(r,c){return 'abcdefgh'[c]+(8-r)}function render(){boardEl.innerHTML='';const legal=game.moves({verbose:true}),dests=selected?legal.filter(m=>m.from===selected).map(m=>m.to):[];let rows=Array.from({length:8},(_,i)=>i),cols=Array.from({length:8},(_,i)=>i);if(flipped){rows.reverse();cols.reverse()}for(const r of rows)for(const c of cols){const name=sqName(r,c),piece=game.get(name),btn=document.createElement('button');btn.type='button';btn.className='square '+(((r+c)%2===0)?'light':'dark');btn.setAttribute('aria-label',name+(piece?': '+(piece.color==='w'?'white ':'black ')+piece.type:'')+(dests.includes(name)?', legal move':''));if(selected===name)btn.classList.add('selected');if(lastMove&&(lastMove.from===name||lastMove.to===name))btn.classList.add('last');if(piece){const span=document.createElement('span');span.className='piece '+(piece.color==='w'?'white':'black');span.textContent=glyph[piece.color+piece.type];btn.appendChild(span)}if(dests.includes(name)){const mark=document.createElement('span');mark.className=piece?'capture-ring':'dot';btn.appendChild(mark)}if((!flipped&&c===0)||(flipped&&c===7)){const co=document.createElement('span');co.className='coord rank';co.textContent=String(8-r);btn.appendChild(co)}if((!flipped&&r===7)||(flipped&&r===0)){const co=document.createElement('span');co.className='coord file';co.textContent='abcdefgh'[c];btn.appendChild(co)}btn.addEventListener('click',()=>tap(name));boardEl.appendChild(btn)}updateStatus();updateMoves()}function updateStatus(){let text,pill;if(busy){text='Computer is thinking…';pill='BLACK THINKING'}else if(game.in_checkmate()){text='Checkmate! '+(game.turn()==='w'?'Black':'White')+' wins.';pill='GAME OVER'}else if(game.in_stalemate()){text='Draw by stalemate.';pill='DRAW'}else if(game.insufficient_material()){text='Draw — insufficient material.';pill='DRAW'}else if(game.in_threefold_repetition()){text='Draw by threefold repetition.';pill='DRAW'}else if(game.in_draw()){text='Draw.';pill='DRAW'}else{text=(game.turn()==='w'?'White':'Black')+' to move'+(game.in_check()?' — Check!':'');pill=game.turn()==='w'?'WHITE TO MOVE':'BLACK TO MOVE'}statusEl.textContent=text;turnEl.textContent=pill;document.getElementById('back').disabled=game.history().length===0}function updateMoves(){const hist=game.history();if(!hist.length){movesEl.textContent='Your moves will appear here.';return}let out='';for(let i=0;i<hist.length;i+=2)out+=(Math.floor(i/2)+1)+'. '+hist[i]+(hist[i+1]?' '+hist[i+1]:'')+'   ';movesEl.textContent=out;movesEl.scrollTop=movesEl.scrollHeight}function tap(name){if(busy||game.game_over()||game.turn()!=='w')return;if(selected&&selected!==name){const options=game.moves({square:selected,verbose:true}).filter(m=>m.to===name);if(options.length){let promotion='q';if(options.some(m=>m.flags.includes('p'))){const answer=prompt('Promote pawn to: Q (queen), R (rook), B (bishop), or N (knight)','q');if(answer===null){noteEl.textContent='Promotion cancelled. Choose a destination again.';return}promotion=answer.trim().toLowerCase();if(!['q','r','b','n'].includes(promotion)){noteEl.textContent='Please enter q, r, b, or n for promotion.';return}}const result=game.move({from:selected,to:name,promotion});if(result){lastMove={from:result.from,to:result.to};selected=null;noteEl.textContent=result.san+(game.in_check()?' — check!':'');render();if(!game.game_over()&&game.turn()==='b'){busy=true;const token=gameToken;render();setTimeout(()=>computerMove(token),180)}return}}}const piece=game.get(name);if(piece&&piece.color===game.turn()){selected=name;const targets=game.moves({square:name,verbose:true}).map(m=>m.to);noteEl.textContent=targets.length?'Choose a highlighted square.':'This piece has no legal moves.'}else{selected=null;noteEl.textContent='Choose one of your own pieces, then a highlighted destination.'}render()}
// Stockfish runs in a separate worker so thinking never freezes the board.
let engineWorker=null,engineState='new',engineQueue=[];
const engineBase='https://cdn.jsdelivr.net/npm/stockfish@19.0.1/';
function startEngine(){
 if(engineWorker||engineState==='failed')return;
 try{
  const workerCode="self.Module={locateFile:function(path){return '"+engineBase+"'+path;}};importScripts('"+engineBase+"stockfish-19-lite-single.js');";
  const blob=new Blob([workerCode],{type:'text/javascript'});
  engineWorker=new Worker(URL.createObjectURL(blob));
  engineWorker.onmessage=function(event){
   const line=String(event.data||'').trim();
   if(line==='uciok'){engineState='uci';engineWorker.postMessage('isready');return;}
   if(line==='readyok'){engineState='ready';const q=engineQueue.splice(0);q.forEach(fn=>fn());return;}
   if(line.startsWith('bestmove ')){
    const token=activeEngineToken;activeEngineToken=null;
    if(token===null||token!==gameToken||!busy)return;
    const uci=line.split(/\s+/)[1];
    if(uci&&uci!=='(none)'){
     const move={from:uci.slice(0,2),to:uci.slice(2,4)};
     if(uci.length>4)move.promotion=uci[4];
     const result=game.move(move);
     if(result){lastMove={from:result.from,to:result.to};noteEl.textContent='Stockfish played '+result.san+(game.in_check()?' — check!':'');}
     else noteEl.textContent='Computer returned an invalid move. Please restart.';
    }else if(!game.game_over())noteEl.textContent='Computer could not find a move. Please restart.';
    busy=false;selected=null;render();
   }
  };
  engineWorker.onerror=function(){engineState='failed';busy=false;noteEl.textContent='Chess engine could not load. Check your internet connection and reload.';render();};
  engineState='loading';engineWorker.postMessage('uci');
 }catch(e){engineState='failed';noteEl.textContent='Unable to start the chess engine. Check your internet connection.';}
}
let activeEngineToken=null;
function computerMove(token){
 if(token!==gameToken||!busy)return;
 if(game.game_over()||game.turn()!=='b'){busy=false;render();return;}
 startEngine();
 const runSearch=()=>{
  if(token!==gameToken||!busy||!engineWorker)return;
  const level=Number(document.getElementById('level').value)||2;
  const depth=level===1?9:level===2?13:17;
  const skill=level===1?2:level===2?10:20;
  activeEngineToken=token;
  engineWorker.postMessage('stop');
  engineWorker.postMessage('setoption name Skill Level value '+skill);
  engineWorker.postMessage('position fen '+game.fen());
  engineWorker.postMessage('go depth '+depth+' movetime '+(level===1?500:level===2?1000:1800));
 };
 if(engineState==='ready')runSearch();
 else if(engineState==='failed'){busy=false;render();}
 else {engineQueue.push(runSearch);if(!computerMove.loadTimer){computerMove.loadTimer=setTimeout(()=>{if(engineState!=='ready'&&busy&&token===gameToken){busy=false;noteEl.textContent='Chess engine is taking too long to load. Check your internet connection and reload.';render();}},20000);}}
}

document.getElementById('back').addEventListener('click',()=>{gameToken++;busy=false;let m=game.undo();if(m&&game.turn()==='w'&&game.history().length)m=game.undo();if(m){lastMove=null;const h=game.history({verbose:true});if(h.length)lastMove={from:h[h.length-1].from,to:h[h.length-1].to};selected=null;noteEl.textContent='Last move undone.';render()}});document.getElementById('restart').addEventListener('click',()=>{gameToken++;busy=false;game.reset();selected=null;lastMove=null;noteEl.textContent='New game started. White moves first.';render()});document.getElementById('flip').addEventListener('click',()=>{flipped=!flipped;render()});render()})();
</script></body></html>
