<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17352d">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>Chess — Play & Learn</title>
<style>
:root{--bg:#f4f1e8;--green:#21483b;--cream:#f0d9b5;--tan:#b58863;--gold:#f5ce61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17251f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--green);color:white;text-align:center;padding:18px}h1{margin:0;font-size:25px}header p{margin:6px 0 0;font-size:13px}
main{max-width:560px;margin:auto;padding:14px}.panel{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #18352b12}
.status{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;margin-bottom:12px}.pill{font-size:11px;background:#e8efe9;color:#28513f;border-radius:99px;padding:7px;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #294537;border-radius:8px;overflow:hidden;touch-action:manipulation}
.square{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;border:0;padding:0;min-width:0;font-family:"Segoe UI Symbol","DejaVu Sans",serif;font-size:clamp(27px,8vw,49px);line-height:1}
.light{background:var(--cream)}.dark{background:var(--tan)}.piece.white{color:#fffdf4;text-shadow:1px 1px 1px #222,-1px -1px 1px #222}.piece.black{color:#171717}
.square.selected{box-shadow:inset 0 0 0 4px var(--gold)}.dot{position:absolute;width:24%;height:24%;border-radius:50%;background:#285d3c99}.ring{position:absolute;inset:5%;border:4px solid #285d3c99;border-radius:50%}
.coord{position:absolute;font:10px sans-serif;opacity:.75}.rank{top:3px;left:4px}.file{bottom:3px;right:4px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}button.action{border:0;border-radius:10px;padding:12px 5px;font-size:14px;font-weight:700;background:#e9eee9;color:#244638}button.primary{background:var(--green);color:white}button:disabled{opacity:.4}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;font-size:14px}.controls select{padding:8px;border:1px solid #cbd5ce;border-radius:9px}
.note{margin:12px 2px;min-height:38px;font-size:13px;line-height:1.5;color:#53645b}.moves{border-top:1px solid #e6e9e4;padding-top:10px}.moves h2{font-size:14px;margin:0 0 7px}.move-list{font-size:13px;line-height:1.8;max-height:100px;overflow:auto}
</style></head>
<body>
<header><h1>♟ Chess</h1><p>Play against a stronger computer opponent</p></header>
<main><section class="panel">
<div class="status"><span id="status">Loading chess…</span><span class="pill" id="turn">WHITE TO MOVE</span></div>
<div class="board" id="board" aria-label="Chessboard"></div>
<div class="actions"><button class="action" id="back">← Back</button><button class="action primary" id="restart">↻ Restart</button><button class="action" id="flip">⇅ Flip board</button></div>
<div class="controls"><label for="level">Computer strength</label><select id="level"><option value="1">Easy</option><option value="2" selected>Medium</option><option value="3">Hard</option></select></div>
<div class="note" id="note">You play White. Stockfish plays Black. Internet is needed to load the engine.</div><div class="note" id="score"><b>Win / Draw / Loss:</b> Waiting for the first move.</div>
<div class="moves"><h2>Move history</h2><div class="move-list" id="moves">Your moves will appear here.</div></div>
</section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(()=>{
const glyph={wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟︎"};
const $=id=>document.getElementById(id),board=$("board");
let game,selected=null,flipped=false,last=null,busy=false,token=0,worker=null,engineReady=false,engineFailed=false,activeToken=null,readyQueue=[];
try{if(!window.Chess)throw Error("Chess rules did not load. Check your internet connection.");game=new Chess()}catch(e){$("status").textContent="Unable to start";$("note").textContent=e.message;return}
function name(r,c){return "abcdefgh"[c]+(8-r)}
function render(){
 board.innerHTML="";const legal=game.moves({verbose:true}),targets=selected?legal.filter(m=>m.from===selected).map(m=>m.to):[];
 let rs=[0,1,2,3,4,5,6,7],cs=[0,1,2,3,4,5,6,7];if(flipped){rs.reverse();cs.reverse()}
 for(const r of rs)for(const c of cs){const s=name(r,c),p=game.get(s),b=document.createElement("button");b.className="square "+((r+c)%2===0?"light":"dark");b.type="button";
 if(selected===s)b.classList.add("selected");if(last&&(last.from===s||last.to===s))b.style.backgroundImage="linear-gradient(#f7df6a66,#f7df6a66)";
 if(p){const span=document.createElement("span");span.className="piece "+(p.color==="w"?"white":"black");span.textContent=glyph[p.color+p.type];b.append(span)}
 if(targets.includes(s)){const mark=document.createElement("span");mark.className=p?"ring":"dot";b.append(mark)}
 if((!flipped&&c===0)||(flipped&&c===7)){const x=document.createElement("span");x.className="coord rank";x.textContent=8-r;b.append(x)}
 if((!flipped&&r===7)||(flipped&&r===0)){const x=document.createElement("span");x.className="coord file";x.textContent="abcdefgh"[c];b.append(x)}
 b.addEventListener("click",()=>tap(s));board.append(b)}
 update();
}
function update(){
 let t=busy?"Computer is thinking…":game.in_checkmate()?"Checkmate! "+(game.turn()==="w"?"Black":"White")+" wins.":game.in_stalemate()?"Draw by stalemate.":game.in_draw()?"Draw.":(game.turn()==="w"?"White":"Black")+" to move"+(game.in_check()?" — Check!":"");
 $("status").textContent=t;$("turn").textContent=busy?"THINKING":game.game_over()?"GAME OVER":game.turn()==="w"?"WHITE TO MOVE":"BLACK TO MOVE";
 $("back").disabled=!game.history().length;
 const h=game.history();$("moves").textContent=h.length?h.reduce((a,m,i)=>a+(i%2===0?(Math.floor(i/2)+1)+". ":"")+m+(i%2?"   ":" "), ""):"Your moves will appear here.";
}
function tap(s){
 if(busy||game.game_over()||game.turn()!=="w")return;
 if(selected&&selected!==s){const opts=game.moves({square:selected,verbose:true}).filter(m=>m.to===s);
  if(opts.length){let promotion="q";if(opts.some(m=>m.flags.includes("p"))){const a=prompt("Promote to Q, R, B or N?","q");if(a===null)return;promotion=a.toLowerCase().trim();if(!["q","r","b","n"].includes(promotion)){ $("note").textContent="Enter q, r, b or n.";return}}
   const m=game.move({from:selected,to:s,promotion});if(m){last={from:m.from,to:m.to};selected=null;$("note").textContent="You played "+m.san;render();if(!game.game_over())computerMove();return}
  }}
 const p=game.get(s);if(p&&p.color==="w"){selected=s;$("note").textContent="Choose a highlighted destination."}else{selected=null;$("note").textContent="Select one of your white pieces."}render();
}
function startEngine(){
 if(worker||engineFailed)return;
 try{
  // Stockfish's published single-threaded build is itself a Worker script.
  // Start it directly; its matching WASM file is in the same CDN directory.
  const engineUrl="https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.js";
  worker=new Worker(engineUrl);
  worker.onmessage=e=>{
   const line=String(e.data||"").trim();
   if(line==="uciok"){worker.postMessage("isready");return}
   if(line==="readyok"){engineReady=true;const q=readyQueue.splice(0);q.forEach(fn=>fn());return}
   if(line.startsWith("info ") && line.includes(" score ")){
    const cp=line.match(/ score cp (-?\\d+)/), mate=line.match(/ score mate (-?\\d+)/);
    if(cp||mate){
     let evalPawns=cp?Number(cp[1])/100:(Number(mate[1])>0?10:-10);
     if(game.turn()==="b")evalPawns=-evalPawns;
     const white=1/(1+Math.pow(10,-evalPawns*1.15));
     const draw=Math.max(0.04,0.30*Math.exp(-Math.abs(evalPawns)*0.72));
     const win=white*(1-draw),loss=(1-white)*(1-draw),sum=win+draw+loss;
     $("score").innerHTML="<b>Estimated White win / Draw / Black win:</b> "+Math.round(100*win/sum)+"% / "+Math.round(100*draw/sum)+"% / "+Math.round(100*loss/sum);
    }
   }
   if(line.startsWith("bestmove ")){
    const t=activeToken;activeToken=null;if(t!==token||!busy)return;
    const u=line.split(/\s+/)[1];if(u&&u!=="(none)"){const m=game.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(m){last={from:m.from,to:m.to};$("note").textContent="Computer played "+m.san}}
    busy=false;render();
   }
  };
  worker.onerror=()=>{engineFailed=true;busy=false;$("note").textContent="The chess engine could not load. Check your internet connection and reload.";render()};
  worker.postMessage("uci");$("note").textContent="Loading Stockfish chess engine…";
 }catch(e){engineFailed=true;$("note").textContent="Unable to start the chess engine. Please reload."}
}
function computerMove(){
 busy=true;const myToken=++token;render();startEngine();
 const search=()=>{if(myToken!==token||!busy||!worker)return;const level=+$("level").value;
  const depth=[8,11,14][level-1],time=[700,1300,2200][level-1],skill=[2,10,20][level-1];
  activeToken=myToken;worker.postMessage("setoption name Skill Level value "+skill);
  worker.postMessage("position fen "+game.fen());worker.postMessage("go depth "+depth+" movetime "+time);
 };
 if(engineReady)search();else if(!engineFailed){readyQueue.push(search);setTimeout(()=>{if(busy&&myToken===token&&!engineReady){busy=false;$("note").textContent="Engine loading timed out. Check internet and reload.";render()}},25000)}
}
$("back").onclick=()=>{token++;busy=false;const a=game.undo();if(a&&game.turn()==="w"&&game.history().length)game.undo();selected=null;last=null;const h=game.history({verbose:true});if(h.length)last={from:h[h.length-1].from,to:h[h.length-1].to};$("note").textContent="Last move undone.";render()};
$("restart").onclick=()=>{token++;busy=false;game.reset();selected=null;last=null;$("note").textContent="New game. You play White.";render()};
$("flip").onclick=()=>{flipped=!flipped;render()};
render();
})();
</script></body></html>
